[package]
name = "lockethud-mac-editor"
version = "0.1.3"
description = "乐奇相片hud 的本地 Mac 编辑器"
authors = ["wenshuishi0528"]
license = "CC-BY-4.0"
edition = "2021"

[lib]
name = "lockethud_mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
