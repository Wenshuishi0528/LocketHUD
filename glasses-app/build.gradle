plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.local.lockethud.poc'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.local.lockethud.poc'
        minSdk 32
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
